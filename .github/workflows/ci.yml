name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The headless build of OpenCV: CI has no display, and the normal
          # wheel drags in GUI libraries that are not installed there.
          pip install numpy "opencv-python-headless>=4.8" pytest pyflakes
          pip install fastapi "uvicorn[standard]" python-multipart httpx

      - name: Lint
        run: python -m pyflakes src/ tests/ examples/ run.py

      - name: Tests
        # The suite uses stand-in models, so nothing is downloaded and
        # insightface is not needed to run it.
        run: python -m pytest -q
        env:
          PYTHONPATH: src

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t oneshot-fd .

      - name: Start it
        run: |
          docker run -d --name ofd -p 8000:8000 oneshot-fd
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "up after ${i}s"; break
            fi
            sleep 1
          done

      - name: Check it answers
        run: |
          curl -fsS http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8000/ | grep -q "One-Shot Face Recognition"

      - name: Logs on failure
        if: failure()
        run: docker logs ofd
